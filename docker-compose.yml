version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: monokoane_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Monokoane
      POSTGRES_DB: MonoxProperty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monokoane_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET Backend API
  api:
    build:
      context: ./Monokoane\ Property
      dockerfile: Dockerfile
    container_name: monokoane_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MonoxProperty;Username=postgres;Password=Monokoane
      - Jwt__Key=k3V8f9X2mN0pQ7rT1yU4iO6aL5sD9gH2jK4lM8nB3vC7xZ1qW0eR
      - Jwt__Issuer=MonoxPropertyUsers
      - Jwt__Audience=JWT_AUDIENCE:MonokoaneProperty
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monokoane_network
    volumes:
      - ./Monokoane\ Property:/app
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./Monokoane\ Property/Client
      dockerfile: Dockerfile
    container_name: monokoane_frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:5000
    networks:
      - monokoane_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  monokoane_network:
    driver: bridge
